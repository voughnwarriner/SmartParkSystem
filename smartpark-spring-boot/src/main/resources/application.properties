spring.application.name=smartpark

# H2 in-memory database. Data is recreated when the application restarts.
spring.datasource.url=jdbc:h2:mem:smartparkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console is for local development only.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Assessment-only static credentials. Override these in deployment environments.
smartpark.auth.username=${SMARTPARK_USERNAME:admin}
smartpark.auth.password=${SMARTPARK_PASSWORD:SmartPark123!}
smartpark.jwt.issuer=smartpark-api
smartpark.jwt.secret-base64=${SMARTPARK_JWT_SECRET:REPLACE_WITH_A_BASE64_ENCODED_SECRET_OF_AT_LEAST_32_BYTES}
smartpark.jwt.expiration-minutes=15

# Scheduler checks for sessions exceeding 15 minutes.
smartpark.scheduler.fixed-delay-ms=30000

# Keep the API errors readable during the assessment.
server.error.include-message=always
